name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    outputs:
      released: ${{ steps.release.outputs.released }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx semantic-release && echo "released=true" >> $GITHUB_OUTPUT || echo "released=false" >> $GITHUB_OUTPUT

  deploy-dev:
    needs: release
    runs-on: ubuntu-latest
    environment: dev
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun wrangler d1 migrations apply DB --remote --env dev

      - name: Deploy to dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: dev
          secrets: |
            APP_URL
            PAGES_URL
            BOT_TOKEN
            BOT_SECRET
            BOT_DEVELOPER
            KEY
            IV
            PROXY
            PROXY_SIGNATURE
            CLIENT_ID
            INSTITUTE_ID
            LIMIT_PER_DAY
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          BOT_DEVELOPER: ${{ secrets.BOT_DEVELOPER }}
          KEY: ${{ secrets.KEY }}
          IV: ${{ secrets.IV }}
          PROXY: ${{ secrets.PROXY }}
          PROXY_SIGNATURE: ${{ secrets.PROXY_SIGNATURE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          INSTITUTE_ID: ${{ secrets.INSTITUTE_ID }}
          LIMIT_PER_DAY: ${{ secrets.LIMIT_PER_DAY }}

  deploy-prod:
    needs: [release, deploy-dev]
    runs-on: ubuntu-latest
    environment: prod
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun wrangler d1 migrations apply DB --remote --env prod

      - name: Deploy to prod
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: prod
          secrets: |
            APP_URL
            PAGES_URL
            BOT_TOKEN
            BOT_SECRET
            BOT_DEVELOPER
            KEY
            IV
            PROXY
            PROXY_SIGNATURE
            CLIENT_ID
            INSTITUTE_ID
            LIMIT_PER_DAY
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          BOT_DEVELOPER: ${{ secrets.BOT_DEVELOPER }}
          KEY: ${{ secrets.KEY }}
          IV: ${{ secrets.IV }}
          PROXY: ${{ secrets.PROXY }}
          PROXY_SIGNATURE: ${{ secrets.PROXY_SIGNATURE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          INSTITUTE_ID: ${{ secrets.INSTITUTE_ID }}
          LIMIT_PER_DAY: ${{ secrets.LIMIT_PER_DAY }}
